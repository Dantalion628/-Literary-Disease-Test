{% extends "base.html" %}
{% block title %}文学症候群报告{% endblock %}

{% block body %}
<main class="landing">

    <p class="landing-eyebrow">一份自我诊断</p>
    <h1 class="landing-title">文学<br>症候群</h1>

      找出你的文学症候

      有些人的悲伤，比别人的更有质感。<br>
